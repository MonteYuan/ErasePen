---
name: Build unsigned IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned app
        run: |
          xcodebuild -project ErasePen/ErasePen.xcodeproj \
            -scheme ErasePen \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "ErasePen.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "ErasePen.app not found under DerivedData"
            find ~/Library/Developer/Xcode/DerivedData -maxdepth 4 -type d | head -n 50
            exit 1
          fi
          rm -rf Payload ErasePen-unsigned.ipa
          mkdir Payload
          cp -r "$APP_PATH" Payload/
          zip -r ErasePen-unsigned.ipa Payload
          ls -lh ErasePen-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ErasePen-unsigned-ipa
          path: ErasePen-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
---
